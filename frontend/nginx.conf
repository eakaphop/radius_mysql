# Static file server for the built SPA, plus a same-origin proxy to the
# backend. This is this container's own nginx, separate from the host nginx
# that CLAUDE.md says not to touch.
#
# VITE_API_BASE_URL defaults to the relative path "/api/v1" (see
# frontend/Dockerfile), so the browser always calls whatever origin served
# the page — this container proxies that straight to the backend over the
# shared host network (network_mode: host in docker-compose.app.yml). That
# makes the exact same image work unmodified behind a plain HTTP port
# (5174) and behind the Caddy HTTPS entrypoint (docker-compose.caddy.yml)
# without rebuilding, and avoids CORS entirely since it's always same-origin.
server {
    listen 5174;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
